# Hamac, pour vous et vos proches.
#   docker compose up -d --build     puis ouvrez http://localhost:8080 et créez le premier compte (administrateur)
#   docker compose logs hamac        code d'installation demandé pour ce premier compte
#   docker compose exec hamac node cli.mjs invite     code d'invitation à envoyer
#
# Réglages facultatifs : copiez .env.example en .env, à côté de ce fichier. Tout y est expliqué.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hamac
      POSTGRES_PASSWORD: ${HAMAC_DB_PASSWORD:-hamac}
      POSTGRES_DB: hamac
    volumes:
      - hamac-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hamac -d hamac"]
      interval: 3s
      timeout: 3s
      retries: 20

  hamac:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${HAMAC_BIND:-127.0.0.1}:${HAMAC_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://hamac:${HAMAC_DB_PASSWORD:-hamac}@db:5432/hamac
      HAMAC_SIGNUP: ${HAMAC_SIGNUP:-invite}
      HAMAC_SECURE: ${HAMAC_SECURE:-0}
      HAMAC_ALLOW_HTTP: ${HAMAC_ALLOW_HTTP:-0}
      HAMAC_TRUST_PROXY: ${HAMAC_TRUST_PROXY:-0}
      HAMAC_PRICES: ${HAMAC_PRICES:-1}
      HAMAC_TWELVEDATA_KEY: ${HAMAC_TWELVEDATA_KEY:-}
      HAMAC_TWELVEDATA_DAILY_LIMIT: ${HAMAC_TWELVEDATA_DAILY_LIMIT:-800}
      HAMAC_REFRESH_MINUTES: ${HAMAC_REFRESH_MINUTES:-30}
      HAMAC_SESSION_DAYS: ${HAMAC_SESSION_DAYS:-30}
    volumes:
      - hamac-data:/data

volumes:
  hamac-db:
  hamac-data:
