name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Tests et typage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  docker:
    name: Image Docker (instance web)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hamac:ci .
      - name: Démarrage et santé
        run: |
          docker run -d --name hamac -p 8080:8080 hamac:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8080/api/auth/config && exit 0; sleep 1; done
          docker logs hamac; exit 1
